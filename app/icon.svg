<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hubGrad" x1="28" y1="28" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Container -->
  <rect width="64" height="64" rx="15" fill="#000000"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Roulette Track Outer Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="7 3.5"/>

  <!-- Spokes -->
  <line x1="32" y1="13" x2="32" y2="51" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="13" y1="32" x2="51" y2="32" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="18.5" y1="18.5" x2="45.5" y2="45.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="45.5" y1="18.5" x2="18.5" y2="45.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Roulette Indicator Arrow at top -->
  <polygon points="32,9 35,14 29,14" fill="#ffffff"/>

  <!-- Orbit Nodes -->
  <circle cx="32" cy="12" r="2.5" fill="#ffffff"/>
  <circle cx="46.8" cy="17.2" r="2.5" fill="#e4e4e7"/>
  <circle cx="52" cy="32" r="2.5" fill="#d4d4d8"/>
  <circle cx="46.8" cy="46.8" r="2.5" fill="#a1a1aa"/>
  <circle cx="32" cy="52" r="2.5" fill="#71717a"/>
  <circle cx="17.2" cy="46.8" r="2.5" fill="#a1a1aa"/>
  <circle cx="12" cy="32" r="2.5" fill="#d4d4d8"/>
  <circle cx="17.2" cy="17.2" r="2.5" fill="#e4e4e7"/>

  <!-- Central Glowing Hub (The Idea Nucleus) -->
  <circle cx="32" cy="32" r="8" fill="#000000" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="4.5" fill="url(#hubGrad)"/>
  <circle cx="32" cy="32" r="1.8" fill="#000000"/>
</svg>
